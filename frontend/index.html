<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCKGUARD AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5">
    <link rel="stylesheet" href="css/login.css?v=5">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="light-theme">
    <!-- Background Orbs -->
    <div class="bg-orb-1"></div>
    <div class="bg-orb-2"></div>
    <div class="bg-orb-3"></div>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">
                <i data-lucide="shield-alert"></i>
            </div>
            <h1 class="splash-title">ROCKGUARD AI</h1>
            <p class="splash-subtitle">SMART ROCKFALL<br>PREDICTION & ALERT SYSTEM</p>
            <div class="splash-loader">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- Login Page -->
    <div id="login-page" style="display: none;">
        <div class="login-container">
            <div class="login-card glass-panel">
                <div class="login-header">
                    <div class="login-logo">
                        <i data-lucide="shield-alert"></i>
                    </div>
                    <h2>Welcome Back</h2>
                    <p>Sign in to continue to ROCKGUARD AI</p>
                </div>
                
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Email / Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Enter your email or username">
                        <div class="error-message" id="username-error"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" class="form-control" placeholder="Enter your password">
                            <button type="button" class="btn-icon" id="toggle-password" aria-label="Toggle password visibility">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                        <div class="error-message" id="password-error"></div>
                    </div>
                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember-me">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    
                    <div class="error-message text-center mb-4" id="main-error" style="display:none; font-size: 0.9rem;"></div>
                    
                    <button type="submit" class="btn btn-primary btn-login">
                        <span>Login</span>
                        <i data-lucide="arrow-right"></i>
                    </button>
                </form>
                
                <div class="login-footer">
                    ROCKGUARD AI &bull; Mine Safety Monitoring System
                </div>
            </div>
        </div>
    </div>

    <div class="app-container" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i data-lucide="shield-alert"></i></div>
                <div>
                    <h1>ROCKGUARD AI</h1>
                </div>
            </div>
            <nav class="sidebar-nav" style="flex-grow: 1;">
                <button class="nav-item active" data-view="dashboard">
                    <i data-lucide="layout-dashboard"></i> <span>Dashboard</span>
                </button>
                <button class="nav-item" data-view="prediction">
                    <i data-lucide="scan-line"></i> <span>Live Prediction</span>
                </button>
                <button class="nav-item" data-view="simulation">
                    <i data-lucide="image"></i> <span>Dataset Simulation</span>
                </button>
                <button class="nav-item" data-view="map">
                    <i data-lucide="map"></i> <span>Mine Map</span>
                </button>
                <button class="nav-item" data-view="analytics">
                    <i data-lucide="bar-chart-2"></i> <span>Analytics</span>
                </button>
                <button class="nav-item" data-view="history">
                    <i data-lucide="history"></i> <span>Prediction History</span>
                </button>
                <button class="nav-item" data-view="reports">
                    <i data-lucide="file-text"></i> <span>Reports</span>
                </button>
                <button class="nav-item" data-view="alerts">
                    <i data-lucide="bell"></i> <span>Alert Panel</span>
                </button>
            </nav>
            <div class="sidebar-bottom" style="padding: 16px; border-top: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 12px; background:rgba(255,255,255,0.4); border-radius:0 0 24px 0;">
                <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--success); font-weight:600;">
                    <div style="width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success);"></div>
                    System Online
                </div>
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; border: 1px solid var(--glass-border);">
                            <i data-lucide="user" style="width: 16px; height: 16px; color: var(--brand-primary);"></i>
                        </div>
                        <div style="display: flex; flex-direction: column;">
                            <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-main);">Admin User</span>
                            <span style="font-size: 0.75rem; color: var(--text-muted);">Safety Officer</span>
                        </div>
                    </div>
                    <button id="logout-btn" class="btn-icon text-danger" title="Logout" style="padding: 4px; background:transparent; border:none; cursor:pointer;">
                        <i data-lucide="log-out" style="width: 16px; height: 16px; color:var(--danger);"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Loading Overlay -->
            <div id="loading-spinner" class="hidden">
                <i data-lucide="loader-2" class="spin-icon"></i>
                <p>Loading data...</p>
            </div>

            <!-- Views -->
            <div id="view-dashboard" class="view active"></div>
            <div id="view-prediction" class="view"></div>
            <div id="view-simulation" class="view"></div>
            <div id="view-map" class="view"></div>
            <div id="view-analytics" class="view"></div>
            <div id="view-history" class="view"></div>
            <div id="view-reports" class="view"></div>
            <div id="view-alerts" class="view"></div>
        </main>
    </div>

    <!-- Image Preview Modal -->
    <div id="image-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(243, 246, 242, 0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px);">
        <div class="modal-header" style="position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 24px; color: var(--text-main);">
            <div>
                <h3 id="modal-title" style="font-size: 1.25rem; font-weight: 600;">Image Preview</h3>
                <p id="modal-subtitle" style="font-size: 0.9rem; color: var(--text-muted);">1024 × 1024</p>
            </div>
            <div style="display: flex; gap: 16px;">
                <button id="modal-zoom-in" class="btn-icon" style="color: var(--text-main);"><i data-lucide="zoom-in"></i></button>
                <button id="modal-zoom-out" class="btn-icon" style="color: var(--text-main);"><i data-lucide="zoom-out"></i></button>
                <button id="modal-reset" class="btn-icon" style="color: var(--text-main);"><i data-lucide="maximize"></i></button>
                <button id="modal-close" class="btn-icon" style="color: var(--text-main);"><i data-lucide="x"></i></button>
            </div>
        </div>
        <div class="modal-body" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 80px 24px 24px 24px;">
            <img id="modal-img" src="" alt="Large Preview" style="max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.2s ease;">
            <!-- Annotation canvas overlay -->
            <canvas id="modal-canvas" style="position: absolute; pointer-events: none;"></canvas>
        </div>
    </div>
    <script src="js/app.js?v=8"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const splash = document.getElementById('splash-screen');
            let dismissed = false;
            const hideSplash = () => {
                if (dismissed) return;
                dismissed = true;
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.style.visibility = 'hidden';
                        splash.style.display = 'none';
                        if (typeof window.checkAuthAndShow === 'function') {
                            window.checkAuthAndShow();
                        }
                    }, 400);
                } else {
                    if (typeof window.checkAuthAndShow === 'function') {
                        window.checkAuthAndShow();
                    }
                }
            };
            if (splash) {
                splash.addEventListener('click', hideSplash);
                setTimeout(hideSplash, 2200);
            } else {
                if (typeof window.checkAuthAndShow === 'function') {
                    window.checkAuthAndShow();
                }
            }
        });
    </script>
</body>
</html>
